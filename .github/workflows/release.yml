name: Build and Release Binaries

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Multi-Arch Executables and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Tests
        run: npm test

      - name: Bundle with esbuild
        run: |
          npx esbuild src/index.ts --bundle --platform=node --target=node18 --outfile=dist/bundle.js --minify

      - name: Package with pkg for Windows, Linux, and macOS
        run: |
          mkdir -p dist/binaries
          npx @yao-pkg/pkg dist/bundle.js --targets node18-linux-x64,node18-linux-arm64,node18-win-x64,node18-macos-x64,node18-macos-arm64 --output-path dist/binaries
          mv dist/binaries/bundle-win-x64.exe dist/binaries/zenryn-windows-x64.exe || true
          mv dist/binaries/bundle-linux-x64 dist/binaries/zenryn-linux-x64 || true
          mv dist/binaries/bundle-linux-arm64 dist/binaries/zenryn-linux-arm64 || true
          mv dist/binaries/bundle-macos-x64 dist/binaries/zenryn-macos-x64 || true
          mv dist/binaries/bundle-macos-arm64 dist/binaries/zenryn-macos-arm64 || true
          ls -la dist/binaries

      - name: Extract Version from README.md
        id: get_version
        run: |
          VERSION=$(grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' README.md | tail -n 1)
          if [ -z "$VERSION" ]; then
            VERSION="v1.0.0.1"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Found version: $VERSION"

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          gh release create "$VERSION" --title "ZenRyn Release $VERSION" --notes "Automated multi-architecture standalone binary release for ZenRyn." dist/binaries/* || gh release upload "$VERSION" dist/binaries/* --clobber
