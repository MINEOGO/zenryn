name: Build and Release Binaries

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Multi-Arch Executables and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Tests
        run: npm test

      - name: Bundle with esbuild
        run: |
          npx esbuild src/index.ts --bundle --platform=node --target=node18 --outfile=dist/zenryn.js --minify

      - name: Package with pkg for Windows, Linux, and macOS
        run: |
          mkdir -p dist/binaries
          npx @yao-pkg/pkg dist/zenryn.js --targets node18-linux-x64,node18-linux-arm64,node18-win-x64,node18-macos-x64,node18-macos-arm64 --out-path dist/binaries
          if [ -f dist/binaries/zenryn-win-x64.exe ]; then
            cp dist/binaries/zenryn-win-x64.exe dist/binaries/zenryn-windows-x64.exe
          fi
          ls -la dist/binaries
          if [ -z "$(ls -A dist/binaries)" ]; then
            echo "Error: No binaries were created!"
            exit 1
          fi

      - name: Extract Version from README.md
        id: get_version
        run: |
          VERSION=$(grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' README.md | tail -n 1)
          if [ -z "$VERSION" ]; then
            VERSION="v1.0.01.003"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Found version: $VERSION"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: ZenRyn Release ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: dist/binaries/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
